name: Sync and Mirror

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch:

jobs:
  # =====================================================================
  # PART 1: PULL FROM UPSTREAM (Daily / Manual)
  # Automatically detects upstream forks using unauthenticated GitHub API.
  # Always prefers incoming upstream changes (-X theirs) on merge conflicts.
  # [REMOVE THIS JOB ENTIRELY IF YOU DO NOT WANT UPSTREAM SYNCING]
  # =====================================================================
  sync-upstream:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # Required to push synced changes back to your GitHub repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Upstream and Pull
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch repository details from GitHub API unauthenticated
          REPO_API_URL="https://api.github.com/repos/${{ github.repository }}"
          API_RESPONSE=$(curl -s "$REPO_API_URL")
          
          # Extract upstream parent/source clone URL
          UPSTREAM_URL=$(echo "$API_RESPONSE" | jq -r '.source.clone_url // .parent.clone_url // empty')

          if [ -z "$UPSTREAM_URL" ]; then
            echo "::warning:: Fork metadata not found or rate-limited. API Response snippet:"
            echo "$API_RESPONSE" | jq '{message: .message, fork: .fork, parent: .parent.full_name}' || echo "$API_RESPONSE"
            echo "This repository is not a fork or no upstream source was found. Skipping upstream sync."
            exit 0
          fi

          echo "Detected upstream URL: $UPSTREAM_URL"

          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream
          
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"
          
          # Explicit merge with -X theirs strategy accepting incoming changes
          git merge "upstream/$CURRENT_BRANCH" --allow-unrelated-histories -X theirs --no-edit -m "Automated upstream sync (prefer upstream)"
          
          git push origin "$CURRENT_BRANCH" --tags

  # =====================================================================
  # PART 2: MIRROR TO GITLAB (Runs on push, schedule, or manual dispatch)
  # [REMOVE THIS JOB ENTIRELY IF YOU DO NOT WANT GITLAB MIRRORING]
  # =====================================================================
  mirror-gitlab:
    runs-on: ubuntu-latest
    needs: [sync-upstream]
    if: always() && (github.event_name == 'push' || needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          GH_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # Transform username ONLY for GitLab if it is hasankayra04
          if [ "$GH_OWNER" = "hasankayra04" ]; then
            GL_NAMESPACE="hasankayra04-org"
          else
            GL_NAMESPACE="$GH_OWNER"
          fi

          echo "Targeting GitLab namespace: $GL_NAMESPACE / $REPO_NAME"

          git remote add gitlab "https://oauth2:${GITLAB_PAT}@gitlab.com/${GL_NAMESPACE}/${REPO_NAME}.git"
          git push gitlab --all --force
          git push gitlab --tags --force

  # =====================================================================
  # PART 3: MIRROR TO CODEBERG (Runs on push, schedule, or manual dispatch)
  # [REMOVE THIS JOB ENTIRELY IF YOU DO NOT WANT CODEBERG MIRRORING]
  # =====================================================================
  mirror-codeberg:
    runs-on: ubuntu-latest
    needs: [sync-upstream]
    if: always() && (github.event_name == 'push' || needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_PAT: ${{ secrets.CODEBERG_PAT }}
        run: |
          GH_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # Codeberg keeps the exact original GitHub owner name (no changes)
          CB_NAMESPACE="$GH_OWNER"

          echo "Targeting Codeberg namespace: $CB_NAMESPACE / $REPO_NAME"

          git remote add codeberg "https://${CODEBERG_PAT}@codeberg.org/${CB_NAMESPACE}/${REPO_NAME}.git"
          git push codeberg --all --force
          git push codeberg --tags --force
